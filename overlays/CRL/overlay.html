    <style>
@font-face{font-family:Bourgeois;src:url('fonts/Bourgeois-UltraBoldItalic.ttf') format('truetype');font-weight:900;font-style:italic}

@font-face{font-family:'TT Octosquares';src:url('fonts/TT Octosquares Trial Bold.ttf') format('truetype');font-weight:700;font-style:normal}

@font-face{font-family:'TT Octosquares Compressed';src:url('fonts/TT Octosquares Trial Compressed Bold.ttf') format('truetype');font-weight:700;font-style:normal}
@font-face{font-family:'TT Octosquares Compressed';src:url('fonts/TT Octosquares Trial Compressed ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal}
@font-face{font-family:'TT Octosquares Compressed';src:url('fonts/TT Octosquares Trial Compressed Black.ttf') format('truetype');font-weight:900;font-style:normal}
@font-face{font-family:'TT Octosquares Expanded';src:url('fonts/TT Octosquares Trial Expanded Bold.ttf') format('truetype');font-weight:700;font-style:normal}
@font-face{font-family:'TT Octosquares Condensed';src:url('fonts/TT Octosquares Trial Condensed Bold.ttf') format('truetype');font-weight:700;font-style:normal}
@font-face{font-family:'TT Octosquares Condensed';src:url('fonts/TT Octosquares Trial Condensed DemiBold.ttf') format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'TT Octosquares Compressed';src:url('fonts/TT Octosquares Trial Compressed DemiBold.ttf') format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'TT Octosquares Condensed';src:url('fonts/TT Octosquares Trial Condensed Medium.ttf') format('truetype');font-weight:500;font-style:normal}

:root{
  --blue:#1C8FE0;
  --orange:#FF6A00;
  --dark:#23262A;      /* was near-black; greyed out */
  --grey-mid:#2E3237;  /* team-name + clock blocks */
  --dark2:#1B1D21;
  --muted:#9AA0A6;
  --pc-team-color:#1C8FE0;
}
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
body,html{background:transparent;overflow:hidden;width:1920px;height:1080px;font-family:'TT Octosquares',sans-serif;-webkit-font-smoothing:antialiased}

/* ===== Scoreboard =====
   All three rows are drawn as one 920x136 SVG so the outer left/right edges
   can be a single continuous curve running the full height of the block --
   the rows read as one connected shape rather than three stacked bars. Text
   sits in absolutely-positioned overlays on top of the shapes. */
#hud{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  opacity:0;
  transition:opacity .5s ease;
}
#hud.visible{opacity:1}
#scoreboard-block{position:relative;width:920px;height:136px}
#sb-shapes{position:absolute;top:0;left:0;display:block}
.sb-txt{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
#sb-top-text-wrap{top:0;left:0;width:920px;height:36px}
/* Name wraps start below the team-colour line that now sits on top. */
#sb-blue-name-wrap{top:44px;left:0;width:296px;height:58px}
#sb-blue-score-wrap{top:36px;left:278px;width:100px;height:66px}
#sb-clock-wrap{top:36px;left:360px;width:200px;height:66px}
#sb-orange-score-wrap{top:36px;left:542px;width:100px;height:66px}
#sb-orange-name-wrap{top:44px;left:624px;width:296px;height:58px}
#top-bar-text{
  font-family:'TT Octosquares',sans-serif;
  font-weight:700;
  font-size:25px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#D3C79A;
  white-space:nowrap;
}
.team-block-name{
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-weight:500;
  font-style:normal;
  font-size:44px;
  line-height:1;
  letter-spacing:.02em;
  text-transform:uppercase;
  white-space:nowrap;
  text-align:center;
  width:250px;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
}
.score-digit{
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-weight:700;
  font-style:normal;
  font-size:56px;
  color:#fff;
  line-height:1;
  display:inline-block;
}
.score-digit.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1) forwards}
#clock-time{
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-weight:500;
  font-style:normal;
  font-size:52px;
  line-height:1;
  color:#fff;
  letter-spacing:-.01em;
}

/* Row 3 -- pips flanking a centre box that drops deeper than the bar.
   Pips are fixed-width (not flex:1) so they can actually hug the centre
   box: right-aligned on the blue side, left-aligned on the orange side. */
#sb-sub-wrap{
  top:102px;
  left:0;
  width:920px;
  height:34px;
  display:block;
}
#sb-sub-wrap>*{position:absolute}
#sub-text{
  left:288px;
  top:0;
  width:344px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}
#sub-text-inner{
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-weight:600;
  font-size:22px;
  line-height:1;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#e8e8e8;
  white-space:pre;
}
.pips-group{display:flex;align-items:center;gap:8px;top:0;height:16px}
#pips-blue{left:40px;width:235px;justify-content:flex-end}
#pips-orange{left:645px;width:235px;justify-content:flex-start}
.pip{width:40px;height:8px;flex-shrink:0;background:#0F1013;transition:background .3s ease}
/* dimmed team colour so the outline reads as a hairline, not a hard border */
#pips-blue .pip{border:1px solid var(--blue-c-dim,rgba(28,143,224,.45))}
#pips-orange .pip{border:1px solid var(--orange-c-dim,rgba(255,106,0,.45))}

/* ===== Side nameplates ===== */
.nameplate-col{
  position:absolute;
  top:20px;
  display:flex;
  flex-direction:column;
  gap:6px;
  opacity:0;
  transition:opacity .5s ease .25s;
  width:310px;
}
.nameplate-col.visible{opacity:1}
#blue-col{left:0}
#orange-col{right:0}
/* The card background lives on .nameplate so it encapsulates BOTH the name
   row and the boost bar; the bar is inset inside it rather than floating
   outside on the transparent page. */
.nameplate{
  height:45px;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--dark2);
  padding-bottom:6px;
}
.np-bg{
  flex:1;
  display:flex;
  align-items:center;
  padding:0 16px;
  position:relative;
  overflow:hidden;
}
#blue-col .np-bg{flex-direction:row;justify-content:space-between}
#orange-col .np-bg{flex-direction:row-reverse;justify-content:space-between}
.np-name{
  font-family:'TT Octosquares',sans-serif;
  font-weight:700;
  font-style:normal;
  font-size:23px;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.boost-val{
  font-family:'TT Octosquares',sans-serif;
  font-weight:700;
  font-style:normal;
  font-size:23px;
  color:#fff;
  flex-shrink:0;
  min-width:32px;
  text-align:right;
}
#orange-col .boost-val{text-align:left}
.boost-track{position:relative;height:7px;margin:0 12px;background:rgba(0,0,0,.55)}
.boost-fill{position:absolute;top:0;bottom:0;left:0;width:0%;background:var(--blue-c,var(--blue));transition:width .25s ease}
#orange-col .boost-fill{left:auto;right:0;background:var(--orange-c,var(--orange))}
#blue-col .nameplate.spectated{background:var(--blue-c,var(--blue))}
#orange-col .nameplate.spectated{background:var(--orange-c,var(--orange))}
#blue-col .nameplate.spectated .boost-fill,
#orange-col .nameplate.spectated .boost-fill{background:#fff!important}
.nameplate.demolished .np-name{opacity:.35}

/* ===== Player card (bottom-left) ===== */
#player-card{
  position:absolute;
  bottom:30px;
  left:40px;
  display:flex;
  flex-direction:row;
  align-items:flex-end;
  pointer-events:none;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1);
}
#player-card.show{opacity:1;transform:translateY(0)}
#pc-name-bar{
  width:300px;
  height:58px;
  flex-shrink:0;
  background-color:var(--pc-team-color,var(--orange));
  /* faint white sheen lifting off the bottom, same as the scoreboard lines */
  background-image:linear-gradient(to top,rgba(255,255,255,.10),rgba(255,255,255,0) 62%);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:13px;
  padding-right:16px;
  position:relative;
}
#pc-name{
  font-family:'TT Octosquares',sans-serif;
  font-weight:700;
  font-style:normal;
  font-size:26px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#fff;
}
/* Boost bar placed exactly like the left/right cards': inset from the edges,
   sitting above a small gap at the bottom of the block. */
#pc-boost-fill-track{position:absolute;bottom:6px;left:12px;right:16px;height:7px;background:rgba(0,0,0,.55)}
#pc-boost-fill-bar{position:absolute;top:0;bottom:0;left:0;width:0%;background:#fff;transition:width .25s ease}
/* Right side: team-colour line running out along the bottom, stats sat on it. */
#pc-right{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  padding-bottom:7px;
  position:relative;
}
#pc-line{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:7px;
  background-color:var(--pc-team-color,var(--orange));
  background-image:linear-gradient(to top,rgba(255,255,255,.10),rgba(255,255,255,0) 62%);
}
#pc-stats{
  height:62px;
  background:var(--dark2);
  display:flex;
  align-items:center;
  gap:0;
  padding:0 8px;
  border-radius:9px 9px 0 0;
}
.pc-stat{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding:0 15px}
.pc-stat-val{
  font-family:'TT Octosquares',sans-serif;
  font-weight:700;
  font-style:normal;
  font-size:26px;
  color:#fff;
}
.pc-stat-label{
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-weight:600;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--pc-stat-label-color,#8d949c);
}

/* ===== Boost wheel (bottom-right) ===== */
#boost-wheel{
  position:absolute;
  bottom:34px;
  right:22px;
  width:230px;
  height:230px;
  pointer-events:none;
  opacity:0;
  transform:translateY(14px) scale(.9);
  transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1);
  display:flex;
  align-items:center;
  justify-content:center;
}
#player-card.show~#boost-wheel{opacity:1;transform:translateY(0) scale(1)}
#boost-wheel-svg{filter:drop-shadow(0 0 8px rgba(0,0,0,.5))}
#boost-wheel-text{
  position:absolute;
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-weight:500;
  font-style:normal;
  font-size:76px;
  line-height:1;
  color:#fff;
}

/* ===== Goal lower-third (replay) =====
   Same construction as the RLCS overlay -- full-bleed replay graphic with the
   stat row floated over it -- but set in the nameplate face rather than
   Bourgeois, and driven by the live team colours instead of fixed hexes. */
#goal-lower{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .28s ease;
}
#goal-lower.show{opacity:1;transition:opacity .32s ease}
#replay-graphic{
  position:absolute;
  top:0;
  bottom:0;
  left:-2px;
  width:calc(100% + 2px);
  height:100%;
  object-fit:fill;
  display:block;
}
#goal-lower-stats{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%) translateY(22px);
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
  opacity:0;
  transition:opacity .35s ease .22s,transform .35s cubic-bezier(0,0,.2,1) .22s;
}
#goal-lower.show #goal-lower-stats{opacity:1;transform:translateX(-50%) translateY(0)}
#goal-lower:not(.show) #goal-lower-stats{
  opacity:0;
  transform:translateX(-50%) translateY(22px);
  transition:opacity .15s ease 0s,transform .15s cubic-bezier(.4,0,1,1) 0s;
}
/* Icons are knocked to pure white and lit with a team-coloured glow. RLCS
   tints them with a fixed hue-rotate, which only lands on its two hard-coded
   colours -- this keeps them correct for any team colour. */
.gl-icon{
  object-fit:contain;
  flex-shrink:0;
  filter:brightness(0) invert(1)
         drop-shadow(0 0 5px var(--blue-c,var(--blue)))
         drop-shadow(0 0 14px var(--blue-c,var(--blue)));
  transform:translateY(30px);
}
#goal-lower.orange-goal .gl-icon{
  filter:brightness(0) invert(1)
         drop-shadow(0 0 5px var(--orange-c,var(--orange)))
         drop-shadow(0 0 14px var(--orange-c,var(--orange)));
}
#goal-lower-icon-left{width:46px;height:46px}
#goal-lower-speed-icon{width:42px;height:42px}
#goal-lower-assist-icon{width:46px;height:46px;margin-left:24px}
.gl-text{
  font-family:'TT Octosquares',sans-serif;
  font-weight:700;
  font-style:normal;
  font-size:33px;
  color:#fff;
  text-shadow:0 0 8px var(--blue-c,var(--blue)),0 0 18px var(--blue-c-glow,rgba(28,143,224,.7));
  transform:translateY(32px);
}
#goal-lower.orange-goal .gl-text{
  text-shadow:0 0 8px var(--orange-c,var(--orange)),0 0 18px var(--orange-c-glow,rgba(255,106,0,.7));
}
#goal-lower-name{letter-spacing:.07em;text-transform:uppercase;margin-right:24px}
#goal-lower-speed{letter-spacing:.05em}
#goal-lower-speed .speed-unit{font-size:15px;letter-spacing:.18em;opacity:.75;margin-left:3px}
#goal-lower-assist-name{letter-spacing:.07em;text-transform:uppercase}


#stats-wall{
  position:absolute;
  inset:0;
  width:1920px;
  height:1080px;
  z-index:110;
  pointer-events:none;
  opacity:0;
  transition:opacity .55s cubic-bezier(.22,1,.36,1);
  font-family:Bourgeois,sans-serif;
  background-color:#1A1C1F;
  background-image:url('background.png');
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column
}
#stats-wall.show{
  opacity:1
}
#sw-bg-slashes{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
  display:none
}
#sw-wall-gradients{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:1
}
.sw-wall-gradient{
  position:absolute;
  pointer-events:none
}
#sw-blue-wall-gradient{
  background:radial-gradient(100% 125% at 0% 100%,color-mix(in srgb,var(--sw-blue-color,#1C8FE0) 88%,transparent) 0%,color-mix(in srgb,var(--sw-blue-color,#1C8FE0) 46%,transparent) 38%,color-mix(in srgb,var(--sw-blue-color,#1C8FE0) 14%,transparent) 74%,transparent 100%)
}
#sw-orange-wall-gradient{
  background:radial-gradient(100% 125% at 100% 100%,color-mix(in srgb,var(--sw-orange-color,#FF6A00) 88%,transparent) 0%,color-mix(in srgb,var(--sw-orange-color,#FF6A00) 46%,transparent) 38%,color-mix(in srgb,var(--sw-orange-color,#FF6A00) 14%,transparent) 74%,transparent 100%)
}
#sw-header{
  position:relative;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  padding-top:8px;
  flex-shrink:0
}
#sw-series-text{
  font-size:30px;
  font-family:BourgeoisBoldRegular,sans-serif;
  font-weight:700;
  font-style:normal;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#D3C79A;
  text-align:center;
  margin-bottom:10px;
  white-space:nowrap
}
#sw-top-row{
  width:1740px;
  height:94px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  position:relative
}
.sw-side{
  flex:1;
  display:flex;
  align-items:stretch;
  min-width:0
}
.sw-accent-sliver{
  display:none
}
.sw-logo-slice{
  display:none
}
.sw-team-logo{
  width:80px;
  height:80px;
  object-fit:contain;
  flex-shrink:0
}
.sw-logo-abbr{
  font-family:BourgeoisBoldRegular,sans-serif;
  font-size:34px;
  font-weight:700;
  font-style:normal;
  color:#fff;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-align:center;
  line-height:1
}
.sw-name-strip{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 38px;
  overflow:hidden
}
.sw-name-text{
  font-family:'TT Octosquares',sans-serif;
  font-size:44px;
  font-weight:700;
  font-style:normal;
  text-transform:uppercase;
  color:#fff;
  line-height:1;
  white-space:nowrap;
  letter-spacing:.03em;
  transform:translateY(4px)
}
#sw-orange-name-strip{
  justify-content:flex-start
}
.sw-trans-gap{
  display:none
}
.sw-score-box{
  width:121px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2;
  background-image:linear-gradient(to top,rgba(255,255,255,.10),rgba(255,255,255,0) 62%);
}
#sw-blue-score-box{
  margin-right:-25px;
  padding-right:25px;
  clip-path:path("M 0,0 L 96,0 Q 94,47 121,94 L 0,94 Z");
}
#sw-orange-score-box{
  margin-left:-25px;
  padding-left:25px;
  clip-path:path("M 25,0 L 121,0 L 121,94 L 0,94 Q 27,47 25,0 Z");
}
.sw-score-value{
  font-family:'TT Octosquares Condensed','TT Octosquares',sans-serif;
  font-size:66px;
  font-weight:700;
  font-style:normal;
  line-height:1;
  color:#fff;
  transform:translateY(4px)
}
#sw-center-block{
  width:180px;
  flex-shrink:0;
  background:#131519;
  /* same outward bow as the scoreboard clock block: sides bulge slightly and
     draw in toward the bottom (scaled from the 184->134 over 74 shape). */
  clip-path:path("M 0,0 L 180,0 Q 182,47 155,94 L 25,94 Q -2,47 0,0 Z");
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:3;
  gap:2px
}
#sw-game-label{
  font-size:40px;
  font-family:BourgeoisBoldRegular,sans-serif;
  font-weight:700;
  font-style:normal;
  line-height:1;
  color:#fff;
  letter-spacing:.03em;
  transform:translateY(-1px);
  text-transform:uppercase
}
#sw-bo-label{
  position:relative;
  top:-6px;
  font-size:28px;
  font-family:BourgeoisBoldRegular,sans-serif;
  font-weight:700;
  font-style:normal;
  line-height:1;
  color:#B0B6BD;
  letter-spacing:.035em;
  text-transform:uppercase
}
#sw-series-status-row{
  /* 372 = the two 96px score boxes either side of the 180px centre block;
     the extra 68 lets the plate poke out past their outer edges. */
  width:440px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#131519
}
#sw-series-status{
  font-size:26px;
  font-family:BourgeoisBoldRegular,sans-serif;
  font-weight:700;
  font-style:normal;
  text-transform:uppercase;
  color:#B0B6BD;
  letter-spacing:.04em;
  line-height:1;
  white-space:nowrap;

    <script>
const $ = e => document.getElementById(e);

// Team names/abbreviations are broadcaster-set but this page runs same-origin
// with the local control API and can receive relayed values from an
// authenticated LAN guest -- neither should be able to inject markup into a
// page that's live on stream. Escape before anything goes into innerHTML.
function escapeHtml(e) {
