<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <title>RLCS Overlay</title>
    <script src="/socket.io/socket.io.js">
    </script>
    <style>
@font-face{
  font-family:Bourgeois;
  src:url('Bourgeois-UltraBoldItalic.ttf') format('truetype');
  font-weight:900;
  font-style:italic
}
@font-face{
  font-family:BourgeoisBold;
  src:url('Bourgeois-BoldItal.otf') format('opentype');
  font-weight:700;
  font-style:italic
}
@font-face{
  font-family:BourgeoisBoldRegular;
  src:url('Bourgeois-Bold.otf') format('opentype');
  font-weight:700;
  font-style:normal
}
@font-face{
  font-family:BourgeoisMedium;
  src:url('Bourgeois-Medium.ttf') format('truetype');
  font-weight:500;
  font-style:normal
}
@font-face{
  font-family:BourgeoisBoldItalic;
  src:url('Bourgeois-Bold-Italic.ttf') format('truetype');
  font-weight:700;
  font-style:italic
}
:root{
  --pc-team-color:#21afd7;
  --blue-tint:rgb(8,18,22);
  --orange-tint:rgb(22,14,8)
}
*,
::after,
::before{
  box-sizing:border-box;
  margin:0;
  padding:0
}
body,
html{
  background:0 0;
  overflow:hidden;
  width:1920px;
  height:1080px;
  font-family:Bourgeois,sans-serif;
  -webkit-font-smoothing:antialiased
}
#hud{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:0;
  transition:opacity .5s ease
}
#hud.visible{
  opacity:1
}
#hud-outer{
  width:380px;
  transition:width .48s cubic-bezier(.22, 1, .36, 1);
  border:none;
  border-radius:0;
  overflow:hidden;
  position:relative
}
#hud-outer.expanded{
  width:860px
}
#hud-header{
  background:#111;
  height:20px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:height .25s ease
}
#hud-outer.expanded #hud-header,
#hud-outer:has(.name-slide.open) #hud-header{
  height:32px
}
#hud-header span{
  font-family:Bourgeois,sans-serif;
  font-size:13px;
  font-style:italic;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#aaa;
  white-space:nowrap;
  transition:font-size .25s ease,letter-spacing .25s ease
}
#hud-outer.expanded #hud-header span,
#hud-outer:has(.name-slide.open) #hud-header span{
  font-size:19px;
  letter-spacing:.24em
}
#scoreboard{
  display:flex;
  align-items:stretch;
  height:64px;
  width:100%;
  margin-top:-1px
}
.name-slide{
  width:0;
  height:64px;
  flex-shrink:0;
  overflow:hidden;
  transition:width .48s cubic-bezier(.22, 1, .36, 1)
}
.name-slide.open{
  width:240px
}
.name-slide-inner{
  width:240px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 16px;
  position:relative;
  overflow:hidden
}
#blue-slide .name-slide-inner{
  border-radius:0;
  background:#21afd7
}
#orange-slide .name-slide-inner{
  border-radius:0;
  background:#fd5b00
}
.name-slide-inner::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:45%;
  background:0 0;
  pointer-events:none
}
.slide-team-name{
  font-family:BourgeoisBoldItalic,BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:10px;
  text-transform:uppercase;
  color:#fff;
  white-space:nowrap;
  text-align:center;
  position:relative;
  z-index:1;
  transform:translateY(-4px)
}
#scoreboard-core{
  display:flex;
  align-items:stretch;
  height:64px;
  flex-shrink:0;
  width:380px
}
.logo-box{
  width:64px;
  height:64px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-family:BourgeoisBoldRegular,sans-serif;
  font-weight:700;
  font-style:normal;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:.04em;
  text-align:center;
  line-height:1
}
#blue-logo-box{
  background:var(--blue-tint)
}
#orange-logo-box{
  background:var(--orange-tint)
}
.logo-placeholder{
  width:44px;
  height:44px;
  border-radius:4px;
  background:#101114
}
.score-cell{
  width:72px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden
}
.score-cell.blue{
  background:#21afd7
}
.score-cell.orange{
  background:#fd5b00
}
.score-digit{
  font-family:Bourgeois,sans-serif;
  font-weight:900;
  font-style:italic;
  font-size:73px;
  color:#fff;
  line-height:1;
  text-align:center;
  position:relative;
  z-index:1;
  transform:translateY(-6px)
}
.score-digit.bump{
  animation:bump .35s cubic-bezier(.34,1.56,.64,1) forwards
}
#clock-block{
  width:108px;
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0
}
#clock-block:has(#clock-time.ot){
  background:#c00
}
#clock-time{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:50px;
  color:#111;
  line-height:1;
  letter-spacing:-.02em;
  transform:translateY(-1px)
}
#clock-time.ot{
  font-size:39px;
  transform:translateY(-1px);
  color:#fff
}
#abbrev-bar{
  width:380px;
  height:18px;
  background:#000;
  display:flex;
  align-items:center;
  position:relative;
  border:none;
  border-radius:0;
  flex-shrink:0;
  margin-top:-1px
}
#abbrev-bar::after,
#abbrev-bar::before{
  content:'';
  position:absolute;
  top:0;
  width:64px;
  height:100%;
  pointer-events:none;
  z-index:0
}
#abbrev-bar::before{
  left:0;
  background:var(--blue-tint)
}
#abbrev-bar::after{
  right:0;
  background:var(--orange-tint)
}
#blue-abbrev,
#orange-abbrev{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#aaa;
  position:absolute;
  text-align:center;
  z-index:1
}
#blue-abbrev{
  left:0;
  width:64px
}
#orange-abbrev{
  left:316px;
  width:64px
}
#series-pips{
  position:absolute;
  left:64px;
  right:64px;
  display:flex;
  align-items:center;
  gap:3px;
  z-index:1
}
.pip{
  flex:1;
  height:8px;
  border-radius:0;
  background:#555;
  transition:background .3s ease
}
.pip.blue-win{
  background:#21afd7
}
.pip.orange-win{
  background:#fd5b00
}
.pip.match-point{
  box-shadow:0 0 0 1.5px #c9a84c;
  background:#3a3a2a
}
.pip.match-point.blue-win{
  background:#21afd7;
  box-shadow:0 0 0 1.5px #c9a84c
}
.pip.match-point.orange-win{
  background:#fd5b00;
  box-shadow:0 0 0 1.5px #c9a84c
}
.nameplate-col{
  position:absolute;
  top:18px;
  display:flex;
  flex-direction:column;
  gap:4px;
  opacity:0;
  transition:opacity .5s ease .25s
}
.nameplate-col.visible{
  opacity:1
}
#blue-col{
  left:0
}
#orange-col{
  right:0
}
.nameplate{
  display:flex;
  align-items:stretch;
  height:46px;
  position:relative;
  width:320px
}
#blue-col .nameplate{
  flex-direction:row
}
#orange-col .nameplate{
  flex-direction:row-reverse
}
.np-accent{
  display:none
}
.np-bg{
  flex:1;
  height:100%;
  background:#101114;
  display:flex;
  align-items:center;
  padding:0 14px;
  position:relative;
  overflow:hidden
}
.np-name{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:27px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#fff;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1;
  text-align:left;
  transform:translateY(-2px)
}
.boost-track{
  position:absolute;
  bottom:3px;
  left:0;
  right:3px;
  height:5px;
  background:#000
}
#orange-col .boost-track{
  left:3px;
  right:0
}
.boost-fill{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0%;
  background:#21afd7;
  transition:width .25s ease
}
#orange-col .boost-fill{
  left:auto;
  right:0;
  background:#fd5b00
}
.boost-val{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:27px;
  color:#fff;
  flex-shrink:0;
  min-width:36px;
  text-align:right;
  letter-spacing:.03em;
  padding-right:10px;
  transform:translateY(-2px)
}
#orange-col .np-bg{
  flex-direction:row-reverse
}
#orange-col .boost-val{
  text-align:left;
  padding-right:0;
  padding-left:10px
}
#orange-col .np-name{
  text-align:right
}
#blue-col .nameplate.spectated .np-bg{
  background:#21afd7
}
#orange-col .nameplate.spectated .np-bg{
  background:#fd5b00
}
#blue-col .nameplate.spectated .boost-fill,
#orange-col .nameplate.spectated .boost-fill{
  background:#fff!important
}
.np-demo-flash{
  position:absolute;
  inset:0;
  background:rgba(220,30,30,.15);
  pointer-events:none;
  opacity:0;
  transition:opacity .2s
}
.nameplate.demolished .np-demo-flash{
  opacity:1
}
.nameplate.demolished .np-name{
  opacity:.35
}
.np-event-ext{
  position:absolute;
  top:0;
  bottom:0;
  right:-56px;
  width:64px;
  display:flex;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease;
  z-index:6;
  overflow:visible
}
#orange-col .np-event-ext{
  right:auto;
  left:-56px
}
.np-event-ext.show{
  opacity:1
}
.np-event-grad{
  position:absolute;
  top:0;
  bottom:0;
  left:-160px;
  right:0;
  background:linear-gradient(to right,transparent 0,#21afd7 94%,#21afd7 100%)
}
#orange-col .np-event-grad{
  left:0;
  right:-160px;
  background:linear-gradient(to left,transparent 0,#fd5b00 94%,#fd5b00 100%)
}
#blue-col .np-event-grad{
  left:-160px
}
.np-event-icon{
  position:absolute;
  right:3px;
  width:46px;
  height:46px;
  object-fit:contain;
  transition:right .2s ease,left .2s ease;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(255,255,255,.5))
}
#orange-col .np-event-icon{
  right:auto;
  left:3px
}
.np-event-icon2{
  position:absolute;
  right:3px;
  width:46px;
  height:46px;
  object-fit:contain;
  opacity:0;
  transition:opacity .2s ease;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(255,255,255,.5))
}
#orange-col .np-event-icon2{
  right:auto;
  left:3px
}
.striker-icon{
  filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(255,255,255,.5)) brightness(1.8) saturate(.8)!important
}
.np-event-ext.two-icons .np-event-icon{
  right:48px
}
.np-event-ext.two-icons .np-event-icon2{
  opacity:1
}
#orange-col .np-event-ext.two-icons .np-event-icon{
  right:auto;
  left:48px
}
#orange-col .np-event-ext.two-icons .np-event-icon2{
  right:auto;
  left:3px
}
.np-event-icon2[src=""],
.np-event-icon[src=""]{
  display:none
}
#goal-lower{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .28s ease
}
#goal-lower.show{
  opacity:1;
  transition:opacity .32s ease
}
#replay-graphic{
  position:absolute;
  top:0;
  bottom:0;
  left:-2px;
  width:calc(100% + 2px);
  height:100%;
  object-fit:fill;
  display:block
}
#goal-lower-stats{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%) translateY(22px);
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
  opacity:0;
  transition:opacity .35s ease .22s,transform .35s cubic-bezier(0,0,.2,1) .22s
}
#goal-lower.show #goal-lower-stats{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}
#goal-lower:not(.show) #goal-lower-stats{
  opacity:0;
  transform:translateX(-50%) translateY(22px);
  transition:opacity .15s ease 0s,transform .15s cubic-bezier(.4,0,1,1) 0s
}
#goal-lower-icon-left{
  width:46px;
  height:46px;
  object-fit:contain;
  flex-shrink:0;
  filter:brightness(0) invert(1) sepia(1) saturate(1.2) hue-rotate(185deg) drop-shadow(0 0 5px #21afd7) drop-shadow(0 0 14px #21afd7);
  transform:translateY(30px)
}
#goal-lower.orange-goal #goal-lower-icon-left{
  filter:brightness(0) invert(1) sepia(1) saturate(1) hue-rotate(25deg) drop-shadow(0 0 5px #fd5b00) drop-shadow(0 0 14px #fd5b00)
}
#goal-lower-name{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:33px;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:#fff;
  text-shadow:0 0 8px #21afd7,0 0 18px rgba(33,175,215,.7);
  transform:translateY(32px);
  margin-right:24px
}
#goal-lower.orange-goal #goal-lower-name{
  text-shadow:0 0 8px #fd5b00,0 0 18px rgba(253,91,0,.7)
}
#goal-lower-speed-icon{
  width:42px;
  height:42px;
  object-fit:contain;
  flex-shrink:0;
  filter:brightness(0) invert(1) sepia(1) saturate(1.2) hue-rotate(185deg) drop-shadow(0 0 5px #21afd7) drop-shadow(0 0 14px #21afd7);
  transform:translateY(30px)
}
#goal-lower.orange-goal #goal-lower-speed-icon{
  filter:brightness(0) invert(1) sepia(1) saturate(1) hue-rotate(25deg) drop-shadow(0 0 5px #fd5b00) drop-shadow(0 0 14px #fd5b00)
}
#goal-lower-speed{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:33px;
  letter-spacing:.05em;
  color:#fff;
  text-shadow:0 0 8px #21afd7,0 0 18px rgba(33,175,215,.7);
  transform:translateY(32px)
}
#goal-lower.orange-goal #goal-lower-speed{
  text-shadow:0 0 8px #fd5b00,0 0 18px rgba(253,91,0,.7)
}
#goal-lower-speed .speed-unit{
  font-size:15px;
  letter-spacing:.18em;
  opacity:.75;
  margin-left:3px
}
#goal-lower-assist-icon{
  width:46px;
  height:46px;
  object-fit:contain;
  flex-shrink:0;
  filter:brightness(0) invert(1) sepia(1) saturate(1.2) hue-rotate(185deg) drop-shadow(0 0 5px #21afd7) drop-shadow(0 0 14px #21afd7);
  transform:translateY(30px);
  margin-left:24px
}
#goal-lower.orange-goal #goal-lower-assist-icon{
  filter:brightness(0) invert(1) sepia(1) saturate(1) hue-rotate(25deg) drop-shadow(0 0 5px #fd5b00) drop-shadow(0 0 14px #fd5b00)
}
#goal-lower-assist-name{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:33px;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:#fff;
  text-shadow:0 0 8px #21afd7,0 0 18px rgba(33,175,215,.7);
  transform:translateY(32px)
}
#goal-lower.orange-goal #goal-lower-assist-name{
  text-shadow:0 0 8px #fd5b00,0 0 18px rgba(253,91,0,.7)
}
#goal-lower.orange-goal #goal-lower-assist-name{
  text-shadow:0 0 8px #fd5b00,0 0 18px rgba(253,91,0,.7)
}
#player-card{
  position:absolute;
  bottom:0;
  left:0;
  display:flex;
  flex-direction:row;
  align-items:stretch;
  height:52px;
  pointer-events:none;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1)
}
#player-card.show{
  opacity:1;
  transform:translateY(0)
}
#pc-left{
  display:flex;
  flex-direction:row;
  align-items:stretch;
  flex-shrink:0;
  position:relative
}
#pc-boost-box{
  display:flex;
  align-items:center;
  padding:0 16px 0 14px;
  background:#21afd7;
  flex-shrink:0;
  position:relative
}
#pc-boost-val{
  display:none
}
#pc-name{
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:27px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#fff;
  white-space:nowrap;
  transform:translateY(-2px);
  position:relative;
  z-index:1
}
#pc-boost-fill-track{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:4px;
  background:rgba(0,0,0,.3)
}
#pc-boost-fill-bar{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0%;
  background:#fff;
  transition:width .25s ease
}
#pc-name-box{
  display:none
}
#pc-stats{
  background:#101114;
  display:flex;
  align-items:center;
  gap:0;
  padding:0 18px 0 14px;
  border-left:1.5px solid rgba(255,255,255,.07);
  position:relative
}
#pc-stats::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:3px;
  background:var(--pc-team-color,#21afd7)
}
.pc-stat{
  display:flex;
  align-items:baseline;
  gap:4px;
  padding:0 12px
}
.pc-stat+.pc-stat{
  border-left:1px solid rgba(255,255,255,.09)
}
.pc-stat-val{
  font-family:Bourgeois,sans-serif;
  font-weight:900;
  font-style:italic;
  font-size:26px;
  color:#fff;
  letter-spacing:.03em;
  transform:translateY(-2px)
}
.pc-stat-label{
  font-family:Bourgeois,sans-serif;
  font-weight:900;
  font-style:italic;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#888;
  transform:translateY(-1px)
}
#boost-wheel{
  position:absolute;
  bottom:52px;
  right:50px;
  width:120px;
  height:120px;
  pointer-events:none;
  opacity:0;
  transform:translateY(14px) scale(3.2);
  transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1);
  display:flex;
  align-items:center;
  justify-content:center
}
#player-card.show~#boost-wheel{
  opacity:1;
  transform:translateY(0) scale(3.2)
}
#boost-wheel-svg{
  filter:drop-shadow(0 0 8px rgba(0,0,0,.5))
}
#boost-wheel-text{
  position:absolute;
  font-family:BourgeoisBold,sans-serif;
  font-weight:700;
  font-style:italic;
  font-size:32px;
  color:#21afd7;
  letter-spacing:.03em;
  transform:translateY(-2px);
  transition:color .3s ease
}
@keyframes bump{
  0%{
    transform:scale(1) translateY(-6px)
  }
  40%{
    transform:scale(1.4) translateY(-6px)
  }
  100%{
    transform:scale(1) translateY(-6px)
  }
}
#win-screen{
  position:absolute;
  inset:0;
  width:1920px;
  height:1080px;
  pointer-events:none;
  z-index:100;
  font-family:Bourgeois,sans-serif
}
#ws-stage{
  width:100%;
  height:100%;
  background:#05070d;
  position:relative;
  overflow:hidden;
  opacity:0;
  transition:opacity 0s
}
#ws-stage.active{
  opacity:1
}
#ws-hex-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1
}
#ws-hex-pulse{
  position:absolute;
  inset:0;
