<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page Not Found - Rocket Cast</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/build/RC.ico" type="image/x-icon" />
<style>
@font-face{font-family:Bourgeois;src:url('/fonts/Bourgeois-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:Bourgeois;src:url('/fonts/Bourgeois-Bold-Italic.ttf') format('truetype');font-weight:700;font-style:italic;font-display:swap}
:root{
  --font-brand:'Bourgeois','Segoe UI Variable','Trebuchet MS',Verdana,Tahoma,sans-serif;
  --bg:#0e1520;
  --text:#eaf1f8;
  --panel-bg:#141d2b;
  --panel-border:#26374f;
  --muted:#7f93ab;
  --panel-alt:#101724;
  --btn-primary:#2975a4;
  --blue:#21afd7;
  --orange:#fd5b00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI Variable","Trebuchet MS",Verdana,Tahoma,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
a{color:inherit}
.card{max-width:460px;width:100%;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:18px;padding:40px 32px;text-align:center}
/* Same three-box shape as the app's own scoreboard: blue score | clock |
   orange score -- 4 | 0 | 4 lines up on it perfectly. */
.score{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:22px}
.score span{font-family:var(--font-brand);font-weight:700;font-style:italic;font-size:56px;line-height:1;width:56px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.score span:nth-child(1){background:linear-gradient(to bottom,#3db5dd,var(--blue) 60%,#1a8ab0);color:#fff}
.score span:nth-child(2){background:#fff;color:#111;width:70px}
.score span:nth-child(3){background:linear-gradient(to bottom,#ff7b20,var(--orange) 60%,#c4461e);color:#fff}
h1{font-family:var(--font-brand);font-style:italic;font-size:26px;margin:0 0 10px}
p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn-primary);color:#fff;border:none;border-radius:4px;padding:11px 22px;font-size:14px;font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
  <div class="card">
    <div class="score" aria-hidden="true">
      <span>4</span><span>0</span><span>4</span>
    </div>
    <h1>Whiffed It.</h1>
    <p>That page doesn't exist.</p>
    <a class="btn" href="/">&larr; Back to Home</a>
  </div>
</body>
</html>
